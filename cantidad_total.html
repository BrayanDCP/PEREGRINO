<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Cantidad Total</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        body { background-color: #f0f4f8; color: #000; }
        .navbar { background-color: #ffffff !important; }
        .navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
        .nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
        .nav-link:hover { color: #D4AF37 !important; }
        .brand-title { color: #D4AF37; font-weight: bold; }
        .dashboard-box { background-color: #ffffff; }
        .total-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
        }
        .text-gold { color: #D4AF37; font-weight: bold; }
        .fs-4 { font-size: 1.5rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container my-4">
    <h1 class="text-center brand-title mb-4">Resumen Financiero</h1>

    <div class="row" id="resumenTotales">
        <!-- Tarjetas de totales generadas dinámicamente -->
    </div>
</div>

<!-- Scripts -->
<script src="js/dashboard.js"></script>
<script>
    // ===========================
    // Función para mostrar totales
    // ===========================
    function mostrarTotales() {
        const contenedor = document.getElementById("resumenTotales");
        if (!contenedor) return;

        let totalDeudas = 0;
        let totalPagado = 0;
        let totalFaltante = 0;
        let totalPendiente = 0;

        pagos.forEach(pago => {
            totalDeudas += pago.monto_total;
            totalPagado += (pago.monto_total - pago.monto_faltante);
            totalFaltante += pago.monto_faltante;
            if(pago.estado === "Pendiente") totalPendiente += pago.monto_faltante;
        });

        contenedor.innerHTML = `
            <div class="col-md-3">
                <div class="total-card text-center">
                    <h5>Total Deudas</h5>
                    <p class="fs-4 text-gold">$${totalDeudas.toFixed(2)}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="total-card text-center">
                    <h5>Total Pagado</h5>
                    <p class="fs-4 text-success">$${totalPagado.toFixed(2)}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="total-card text-center">
                    <h5>Total Faltante</h5>
                    <p class="fs-4 text-warning">$${totalFaltante.toFixed(2)}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="total-card text-center">
                    <h5>Deudas Pendientes</h5>
                    <p class="fs-4 text-danger">$${totalPendiente.toFixed(2)}</p>
                </div>
            </div>
        `;
    }

    // ===========================
    // Inicialización
    // ===========================
    window.onload = function() {
        if(typeof conectarNavbar === "function") conectarNavbar();
        mostrarTotales();
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
