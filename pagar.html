<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pagar Deuda | Peregrino</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Estilos propios -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">

<style>
body { background-color: #f0f4f8; color: #000; }
.navbar { background-color: #ffffff !important; }
.navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
.nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
.nav-link:hover { color: #D4AF37 !important; }
.auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.auth-box { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
.brand-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; }
.brand-subtitle { text-align: center; margin-bottom: 20px; color: #555; }
.progress { height: 25px; border-radius: 12px; overflow: hidden; }
.progress-bar { font-weight: bold; color: #000; }
.btn-gold { background-color: #D4AF37; color: #000; font-weight: bold; }
.btn-gold:hover { background-color: #C0A030; color: #000; }
</style>
</head>
<body>

<!-- ===========================
        Barra de navegación
=========================== -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="cantidad_total.html">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link" href="estadistica.html">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link" href="notificaciones.html">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===========================
        Contenido principal
=========================== -->
<div class="auth-wrapper">
    <div class="auth-box">
        <h2 class="brand-title">Registrar Pago</h2>
        <p class="brand-subtitle">Ingresa el monto que deseas pagar de tu deuda</p>

        <form id="pagarForm">
            <div class="mb-3">
                <label for="banco" class="form-label">Banco / Empresa</label>
                <input type="text" class="form-control" id="banco" disabled>
            </div>

            <div class="mb-3">
                <label for="concepto" class="form-label">Concepto</label>
                <input type="text" class="form-control" id="concepto" disabled>
            </div>

            <div class="mb-3">
                <label for="monto_faltante" class="form-label">Monto faltante</label>
                <input type="text" class="form-control" id="monto_faltante" disabled>
            </div>

            <div class="mb-3">
                <label for="monto_pago" class="form-label">Monto a pagar</label>
                <input type="number" class="form-control" id="monto_pago" min="0.01" step="0.01" required>
                <div class="error-message text-danger" id="errorMontoPago"></div>
            </div>

            <!-- Barra de progreso -->
            <div class="mb-3">
                <label class="form-label">Progreso de pago</label>
                <div class="progress">
                    <div class="progress-bar bg-gold" role="progressbar" id="progressPago" style="width: 0%">0%</div>
                </div>
            </div>

            <button type="submit" class="btn btn-gold w-100 mt-3">Registrar Pago</button>
        </form>

        <div class="text-center mt-3">
            <a href="dashboard.html">Cancelar y volver</a>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const pagos = JSON.parse(localStorage.getItem("pagos")) || [];
    const indice = parseInt(localStorage.getItem("pagarIndice"));
    if(isNaN(indice) || !pagos[indice]){
        alert("Pago no encontrado");
        window.location.href = "dashboard.html";
        return;
    }

    const pago = pagos[indice];

    // Mostrar datos
    document.getElementById("banco").value = pago.banco;
    document.getElementById("concepto").value = pago.concepto;
    document.getElementById("monto_faltante").value = pago.monto_faltante.toFixed(2);

    const montoPagoInput = document.getElementById("monto_pago");
    const progressBar = document.getElementById("progressPago");
    const errorDiv = document.getElementById("errorMontoPago");

    // Actualizar barra de progreso
    montoPagoInput.addEventListener("input", () => {
        const monto = parseFloat(montoPagoInput.value) || 0;
        let porcentaje = (monto / pago.monto_total) * 100;
        if(porcentaje > 100) porcentaje = 100;
        progressBar.style.width = porcentaje.toFixed(2) + "%";
        progressBar.textContent = porcentaje.toFixed(0) + "%";
    });

    // Manejar formulario
    document.getElementById("pagarForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const montoPago = parseFloat(montoPagoInput.value);
        if(montoPago <= 0 || montoPago > pago.monto_faltante){
            errorDiv.textContent = "Monto inválido";
            return;
        }

        pago.monto_faltante -= montoPago;
        if(pago.monto_faltante < 0) pago.monto_faltante = 0;

        pagos[indice] = pago;
        localStorage.setItem("pagos", JSON.stringify(pagos));

        alert("Pago registrado correctamente");
        window.location.href = "dashboard.html";
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
