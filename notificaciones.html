<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Peregrino | Notificaciones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Estilos propios -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">

<style>
    body { background-color: #f0f4f8; color: #000; }
    .navbar { background-color: #ffffff !important; }
    .navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
    .nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
    .nav-link.active { color: #D4AF37 !important; font-weight: bold; }
    .brand-title { color: #D4AF37; font-weight: bold; }
    .notification-box { 
        background-color: #ffffff; 
        border-radius: 12px; 
        box-shadow: 0 6px 15px rgba(0,0,0,0.1); 
        padding: 20px; 
        max-height: 70vh; 
        overflow-y: auto; 
    }
    .notification-item { 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        margin-bottom: 1rem; 
        padding: 12px; 
        border-left: 5px solid; 
        border-radius: 5px; 
        transition: opacity 0.3s; 
    }
    .pendiente { border-color: #ffc107; background-color: #fff8e1; }
    .pagado { border-color: #28a745; background-color: #e6f9ec; }
    .retrasado { border-color: #dc3545; background-color: #fbe6e6; }
    .notification-item button { 
        border: none; 
        background: transparent; 
        cursor: pointer; 
    }
    .notification-item button:hover { opacity: 0.7; }
    .text-gray { color: #6c757d; }
</style>
</head>
<body>

<!-- ===========================
        Barra de navegación
=========================== -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="cantidad_total.html">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link" href="estadistica.html">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===========================
        Contenido principal
=========================== -->
<div class="container my-4">
    <h1 class="text-center brand-title mb-4">Notificaciones</h1>
    <div class="notification-box" id="notificacionesContainer">
        <!-- Notificaciones se llenarán dinámicamente -->
    </div>
</div>

<!-- Scripts -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const notificacionesContainer = document.getElementById("notificacionesContainer");
    const pagos = JSON.parse(localStorage.getItem("pagos")) || [];

    if (pagos.length === 0) {
        notificacionesContainer.innerHTML = `<p class="text-center text-gray">No hay notificaciones disponibles.</p>`;
        return;
    }

    pagos.forEach((pago, index) => {
        let estadoClass = '';
        if(pago.monto_faltante > 0 && new Date(pago.fecha_fin) < new Date()){
            estadoClass = 'retrasado';
        } else if(pago.monto_faltante === 0){
            estadoClass = 'pagado';
        } else {
            estadoClass = 'pendiente';
        }

        const item = document.createElement('div');
        item.className = `notification-item ${estadoClass}`;
        item.innerHTML = `
            <div>
                <strong>${pago.concepto}</strong> - ${pago.banco}<br>
                <small>${estadoClass.toUpperCase()} | Monto faltante: $${pago.monto_faltante.toFixed(2)}</small>
            </div>
            <button onclick="eliminarNotificacion(${index})">🗑️</button>
        `;
        notificacionesContainer.appendChild(item);
    });
});

function eliminarNotificacion(index) {
    let pagos = JSON.parse(localStorage.getItem("pagos")) || [];
    pagos.splice(index, 1);
    localStorage.setItem("pagos", JSON.stringify(pagos));
    window.location.reload();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
