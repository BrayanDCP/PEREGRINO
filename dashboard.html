<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        body { background-color: #f0f4f8; color: #000; }
        .navbar { background-color: #ffffff !important; }
        .navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
        .nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
        .nav-link:hover { color: #D4AF37 !important; }
        .dashboard-box { background-color: #ffffff; }
        .btn-gold { background-color: #D4AF37; color: #000; font-weight: bold; }
        .btn-gold:hover { background-color: #C0A030; color: #000; }
        .brand-title { color: #D4AF37; font-weight: bold; }

        /* Cards de pagos */
        .card-pago { min-width: 250px; flex: 1 1 250px; margin-bottom: 1rem; }
        .progress { height: 20px; border-radius: 12px; overflow: hidden; }
        .progress-bar { font-weight: bold; color: #000; transition: width 0.3s ease; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Contenido principal -->
<div class="container my-4">
    <h1 class="text-center brand-title mb-2">Bienvenido al Dashboard</h1>
    <p class="text-center text-secondary mb-4">Gestiona tus pagos y mantente al día con tus deudas</p>

    <div class="dashboard-box p-4 rounded shadow">

        <!-- Mensaje motivacional -->
        <div id="mensajeMotivacional" class="mb-4 p-3 bg-light text-center rounded fw-bold">
            <!-- Se llenará desde dashboard.js -->
        </div>

        <!-- Lista de pagos / cards -->
        <div id="listaPagos" class="d-flex flex-wrap justify-content-start gap-3">
            <!-- Cards generadas dinámicamente por dashboard.js -->
        </div>

        <!-- Botón agregar pago -->
        <div class="d-flex justify-content-end mt-4">
            <button class="btn btn-gold" onclick="window.location.href='agregar_pago.html'">Agregar Deuda</button>
        </div>

    </div>
</div>

<!-- Scripts -->
<script src="js/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
