<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Peregrino | Perfil</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Estilos propios -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/auth.css">

<style>
body { background-color: #f0f4f8; color: #000; }
.navbar { background-color: #ffffff !important; }
.navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
.nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
.nav-link:hover { color: #D4AF37 !important; }

.perfil-box { 
    background-color: #ffffff; 
    padding: 30px; 
    border-radius: 12px; 
    box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
    max-width: 500px; 
    margin: auto; 
}
.brand-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; }
.btn-gold { background-color: #D4AF37; color: #000; font-weight: bold; }
.btn-gold:hover { background-color: #C0A030; color: #000; }
label { font-weight: 500; }
</style>
</head>
<body>

<!-- ===========================
        Barra de navegación
=========================== -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="cantidad_total.html">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link" href="estadistica.html">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link" href="notificaciones.html">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===========================
        Contenido principal
=========================== -->
<div class="container my-4">
    <h1 class="text-center brand-title mb-2">Perfil del Usuario</h1>
    <p class="text-center text-secondary mb-4">Información de tu cuenta</p>

    <div class="perfil-box">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <span id="perfilNombre">Cargando...</span>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <span id="perfilEmail">Cargando...</span>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfono:</label>
            <span id="perfilTelefono">Cargando...</span>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha de registro:</label>
            <span id="perfilRegistro">Cargando...</span>
        </div>

        <div class="d-flex justify-content-end">
            <button class="btn btn-gold" id="btnEditarPerfil">Editar Perfil</button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Cargar datos del usuario desde localStorage
    let usuario = JSON.parse(localStorage.getItem("usuario"));

    if(!usuario){
        // Si no hay usuario, redirigir a dashboard (o login)
        alert("No se encontró información de usuario.");
        window.location.href = "dashboard.html";
        return;
    }

    document.getElementById("perfilNombre").textContent = usuario.nombre || "-";
    document.getElementById("perfilEmail").textContent = usuario.email || "-";
    document.getElementById("perfilTelefono").textContent = usuario.telefono || "-";
    document.getElementById("perfilRegistro").textContent = usuario.fechaRegistro || "-";

    // Botón para editar perfil
    document.getElementById("btnEditarPerfil").addEventListener("click", () => {
        // Guardar datos actuales en localStorage para edición
        localStorage.setItem("editarUsuario", JSON.stringify(usuario));
        window.location.href = "editar_perfil.html";
    });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
