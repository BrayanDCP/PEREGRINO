<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Editar Deuda</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        body { background-color: #f0f4f8; }
        .auth-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-box { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .brand-title { color: #D4AF37; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .brand-subtitle { text-align: center; color: #555; margin-bottom: 25px; }
        .btn-gold { background-color: #D4AF37; color: #000; font-weight: bold; }
        .btn-gold:hover { background-color: #C0A030; color: #000; }
        .error-message { color: red; font-size: 0.85rem; margin-top: 3px; }
        a { color: #D4AF37; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-box">
        <h2 class="brand-title">Editar Deuda</h2>
        <p class="brand-subtitle">Actualiza los datos de tu deuda</p>

        <form id="editarForm">
            <!-- Banco / Institución -->
            <div class="mb-3">
                <label for="banco" class="form-label">Banco / Institución</label>
                <input type="text" class="form-control" id="banco" placeholder="Ej. Banco X" required>
                <small class="error-message"></small>
            </div>

            <!-- Concepto -->
            <div class="mb-3">
                <label for="concepto" class="form-label">Concepto / Deuda</label>
                <input type="text" class="form-control" id="concepto" placeholder="Ej. Préstamo personal" required>
                <small class="error-message"></small>
            </div>

            <!-- Monto Total -->
            <div class="mb-3">
                <label for="monto_total" class="form-label">Monto Total</label>
                <input type="number" class="form-control" id="monto_total" placeholder="Ej. 5000" min="0.01" step="0.01" required>
                <small class="error-message"></small>
            </div>

            <!-- Cuotas -->
            <div class="mb-3">
                <label for="cuotas" class="form-label">Número de Cuotas (1-60)</label>
                <input type="number" class="form-control" id="cuotas" placeholder="Ej. 10" min="1" max="60" step="1" required>
                <small class="error-message"></small>
            </div>

            <!-- Monto por cuota -->
            <div class="mb-3">
                <label for="monto_cuota" class="form-label">Monto por Cuota</label>
                <input type="number" class="form-control" id="monto_cuota" placeholder="Ej. 500" min="0.01" step="0.01" required>
                <small class="text-muted">Monto que se paga cada mes según banco</small>
                <small class="error-message"></small>
            </div>

            <!-- Monto faltante -->
            <div class="mb-3">
                <label for="monto_faltante" class="form-label">Monto Faltante</label>
                <input type="number" class="form-control" id="monto_faltante" readonly>
                <small class="text-muted">Monto restante por pagar</small>
            </div>

            <!-- Fecha inicio -->
            <div class="mb-3">
                <label for="fecha_inicio" class="form-label">Fecha Inicio</label>
                <input type="date" class="form-control" id="fecha_inicio" required>
                <small class="error-message"></small>
            </div>

            <!-- Fecha fin -->
            <div class="mb-3">
                <label for="fecha_fin" class="form-label">Fecha Fin</label>
                <input type="date" class="form-control" id="fecha_fin" readonly>
                <small class="text-muted">Se calcula automáticamente según fecha inicio y número de cuotas</small>
            </div>

            <button type="submit" class="btn btn-gold w-100 mt-3">Guardar Cambios</button>
        </form>

        <p class="mt-3 text-center">
            <a href="dashboard.html">Cancelar y volver al Dashboard</a>
        </p>
    </div>
</div>

<!-- Scripts -->
<script src="js/dashboard.js"></script>
<script>
    // ===========================
    // Inicialización de edición
    // ===========================
    const indice = localStorage.getItem("editarIndice");
    if(!indice) window.location.href = "dashboard.html";

    const pago = pagos[indice];

    // Referencias
    const banco = document.getElementById("banco");
    const concepto = document.getElementById("concepto");
    const monto_total = document.getElementById("monto_total");
    const cuotas = document.getElementById("cuotas");
    const monto_cuota = document.getElementById("monto_cuota");
    const monto_faltante = document.getElementById("monto_faltante");
    const fecha_inicio = document.getElementById("fecha_inicio");
    const fecha_fin = document.getElementById("fecha_fin");

    // Rellenar formulario con datos actuales
    banco.value = pago.banco;
    concepto.value = pago.concepto;
    monto_total.value = pago.monto_total;
    cuotas.value = pago.cuotas;
    monto_cuota.value = pago.monto_cuota;
    monto_faltante.value = pago.monto_faltante;
    fecha_inicio.value = pago.fecha_inicio;
    fecha_fin.value = pago.fecha_fin;

    // Función para calcular fecha_fin según fecha_inicio y cuotas
    function actualizarFechaFin() {
        const inicio = new Date(fecha_inicio.value);
        const meses = parseInt(cuotas.value) || 1;
        const fin = new Date(inicio);
        fin.setMonth(fin.getMonth() + meses);
        fecha_fin.value = fin.toISOString().split('T')[0];
    }

    // Función para actualizar monto_faltante automáticamente
    function actualizarMontoFaltante() {
        const total = parseFloat(monto_total.value) || 0;
        const cuota = parseFloat(monto_cuota.value) || 0;
        const faltante = Math.max(total - cuota, 0);
        monto_faltante.value = faltante.toFixed(2);
    }

    fecha_inicio.addEventListener("change", actualizarFechaFin);
    cuotas.addEventListener("input", actualizarFechaFin);
    monto_total.addEventListener("input", actualizarMontoFaltante);
    monto_cuota.addEventListener("input", actualizarMontoFaltante);

    // ===========================
    // Guardar cambios
    // ===========================
    document.getElementById("editarForm").addEventListener("submit", function(e){
        e.preventDefault();

        pago.banco = banco.value.trim();
        pago.concepto = concepto.value.trim();
        pago.monto_total = parseFloat(monto_total.value);
        pago.cuotas = parseInt(cuotas.value);
        pago.monto_cuota = parseFloat(monto_cuota.value);
        pago.monto_faltante = parseFloat(monto_faltante.value);
        pago.fecha_inicio = fecha_inicio.value;
        pago.fecha_fin = fecha_fin.value;

        // Guardar cambios en localStorage
        localStorage.setItem("pagos", JSON.stringify(pagos));
        // Volver al dashboard
        window.location.href = "dashboard.html";
    });

    // ===========================
    // Inicializar navbar
    // ===========================
    if(typeof conectarNavbar === "function") conectarNavbar();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
