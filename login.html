<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        body {
            background-color: #f0f4f8;
            color: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .auth-box {
            background-color: #fff;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }
        .brand-title {
            color: #D4AF37;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .brand-subtitle {
            text-align: center;
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 2rem;
        }
        .btn-gold {
            background-color: #D4AF37;
            color: #000;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-gold:hover {
            background-color: #C0A030;
            color: #000;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
        }
        .error-message {
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .redirect-text {
            text-align: center;
            font-size: 0.9rem;
            color: #555;
        }
        .redirect-text a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: bold;
        }
        .redirect-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-box">

        <h1 class="brand-title">PEREGRINO</h1>
        <p class="brand-subtitle">Inicia sesión para continuar</p>

        <form id="loginForm" novalidate>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" id="email" class="form-control custom-input" placeholder="correo@gmail.com" required>
                <small class="error-message text-danger"></small>
            </div>

            <div class="mb-3 position-relative">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control custom-input" placeholder="********" required>
                <span class="toggle-password">👁️</span>
                <small class="error-message text-danger"></small>
            </div>

            <button type="submit" class="btn btn-gold w-100 mt-3">Iniciar Sesión</button>

        </form>

        <p class="redirect-text mt-4">
            ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
        </p>

    </div>
</div>

<!-- Scripts -->
<script src="js/login.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
