<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Eliminar Pago</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <style>
        .error-message { display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-box">
        <h1 class="brand-title">Eliminar Pago</h1>
        <p class="brand-subtitle">Escribe la palabra <strong>CONFIRMAR</strong> para eliminar la deuda</p>

        <form id="eliminarForm">
            <div class="mb-3">
                <label class="form-label">Escribe "CONFIRMAR"</label>
                <input type="text" id="confirmInput" class="form-control" placeholder="CONFIRMAR" required>
                <small class="error-message text-danger"></small>
            </div>

            <button type="submit" class="btn btn-danger w-100 mt-3">Eliminar Pago</button>
        </form>

        <p class="redirect-text mt-4">
            <a href="dashboard.html">Cancelar y volver al Dashboard</a>
        </p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById("eliminarForm");
    const input = document.getElementById("confirmInput");

    let pagos = JSON.parse(localStorage.getItem("pagos")) || [];
    const eliminarIndice = localStorage.getItem("eliminarIndice");

    if(eliminarIndice === null){
        alert("❌ No se encontró deuda para eliminar");
        window.location.href = "dashboard.html";
    }

    form.addEventListener("submit", function(e){
        e.preventDefault();

        const errorEl = input.nextElementSibling;
        errorEl.textContent = "";

        const textoIngresado = input.value.trim();

        if(textoIngresado !== "CONFIRMAR"){
            errorEl.textContent = "Escribe por favor CONFIRMAR para poder eliminar";
            return;
        }

        if(confirm("⚠️ ¿Estás seguro de eliminar esta deuda? Esta acción no se puede deshacer.")){
            pagos.splice(eliminarIndice, 1);
            localStorage.setItem("pagos", JSON.stringify(pagos));
            localStorage.removeItem("eliminarIndice");

            alert("✅ Deuda eliminada correctamente");
            window.location.href = "dashboard.html";
        }
    });
});
</script>

</body>
</html>
