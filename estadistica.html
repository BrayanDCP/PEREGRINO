<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peregrino | Estadísticas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { background-color: #f0f4f8; color: #000; }
        .navbar { background-color: #ffffff !important; }
        .navbar-brand { color: #D4AF37 !important; font-weight: bold; font-size: 1.5rem; }
        .nav-link { color: #000 !important; font-weight: 500; margin-right: 1rem; }
        .nav-link:hover { color: #D4AF37 !important; }
        .nav-link.active { color: #D4AF37 !important; font-weight: bold; }
        .brand-title { color: #D4AF37; font-weight: bold; margin-bottom: 30px; }
        .chart-box { background-color: #ffffff; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 30px; }
        .chart-empty { text-align: center; color: #888; font-style: italic; padding: 50px 0; }
    </style>
</head>
<body>

<!-- ===========================
        Barra de navegación
=========================== -->
<nav class="navbar navbar-expand-lg shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">Peregrino</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDashboard">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarDashboard">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="perfil.html">Perfil</a></li>
                <li class="nav-item"><a class="nav-link" href="cantidad_total.html">Cantidad Total</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">Estadísticas</a></li>
                <li class="nav-item"><a class="nav-link" href="notificaciones.html">Notificaciones</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===========================
        Contenido principal
=========================== -->
<div class="container my-4">
    <h1 class="text-center brand-title">Estadísticas de Pagos</h1>

    <div id="estadisticasContainer">
        <div class="chart-box" id="chartEstadoBox">
            <h4 class="mb-3">Estado de Pagos</h4>
            <canvas id="estadoPagosChart" height="200"></canvas>
        </div>

        <div class="chart-box" id="chartBancoBox">
            <h4 class="mb-3">Distribución por Banco / Institución</h4>
            <canvas id="bancoChart" height="200"></canvas>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="js/dashboard.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const pagos = JSON.parse(localStorage.getItem("pagos")) || [];

    // Si no hay pagos
    if(pagos.length === 0){
        document.getElementById("estadisticasContainer").innerHTML = `
            <div class="chart-empty">
                No hay pagos registrados aún.<br>
                Registra deudas en el <a href="dashboard.html">Dashboard</a> para ver estadísticas.
            </div>
        `;
        return;
    }

    // =====================
    // Gráfico 1: Estado de Pagos
    // =====================
    const totalPagos = pagos.length;
    const pagados = pagos.filter(p => p.monto_faltante == 0).length;
    const pendientes = totalPagos - pagados;

    const ctxEstado = document.getElementById("estadoPagosChart").getContext("2d");
    new Chart(ctxEstado, {
        type: 'doughnut',
        data: {
            labels: ['Pagados', 'Pendientes'],
            datasets: [{
                data: [pagados, pendientes],
                backgroundColor: ['#D4AF37', '#6c757d']
            }]
        },
        options: { responsive:true, plugins:{ legend:{ position:'bottom' } } }
    });

    // =====================
    // Gráfico 2: Distribución por Banco
    // =====================
    const bancos = {};
    pagos.forEach(p => {
        bancos[p.banco] = (bancos[p.banco] || 0) + 1;
    });

    const ctxBanco = document.getElementById("bancoChart").getContext("2d");
    new Chart(ctxBanco, {
        type: 'bar',
        data: {
            labels: Object.keys(bancos),
            datasets: [{
                label: 'Número de pagos',
                data: Object.values(bancos),
                backgroundColor: '#D4AF37'
            }]
        },
        options: {
            responsive:true,
            plugins:{ legend:{ display:false } },
            scales: { y: { beginAtZero:true, stepSize:1 } }
        }
    });
});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
